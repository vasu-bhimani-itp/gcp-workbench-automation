name: List User Workbenches

on:
  workflow_dispatch: 

jobs:
  list-configurations:
    name: Get Workbench Configurations
    runs-on: ubuntu-latest
    
    permissions:
      id-token: write     
      contents: read
      
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4


      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider:  ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.SERVICE_ACCOUNT }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Fetch and Display Workbench Configurations
        run: |
          echo "Looking up Vertex AI Workbench configurations for GitHub Actor: ${{ github.actor }}"
          echo "----------------------------------------------------------------------"
          
          # Retrieves all workbench instances across all regions (-) in JSON format.
          # jq filters by the 'github_username' label and maps the newer Vertex AI JSON structure.
          gcloud workbench instances list --location="-" --format="json" | jq -r --arg ACTOR "${{ github.actor }}" '
            .[] | 
            select(.labels.github_username == $ACTOR) | 
            "Workbench Name            : \(.name | split("/")[-1])\n" +
            "State                     : \(.state // "UNKNOWN")\n" +
            "Connection URL            : \(.proxyUri // "Not Available (Start instance to see URL)")\n" +
            "Owner Email ID            : \(.creator // "N/A")\n" +
            "Storage (Boot Disk)       : \(.gceSetup.bootDisk.diskSizeGb // "0") GB\n" +
            "Storage (Data Disk)       : \(.gceSetup.dataDisks[0].diskSizeGb // "0") GB\n" +
            "CPU (Machine Type)        : \(.gceSetup.machineType | split("/")[-1])\n" +
            "Auto-Shutdown Inactivity  : \(.gceSetup.metadata."idle-timeout" // .gceSetup.metadata.idleTimeout // "No Auto-shutdown configured")\n" +
            "GPU Enabled               : \(if (.gceSetup.acceleratorConfigs | length > 0) then "Yes" else "No" end)\n" +
            "GPU Type & Cores          : \(if (.gceSetup.acceleratorConfigs | length > 0) then .gceSetup.acceleratorConfigs[0].type + " (Cores: " + (.gceSetup.acceleratorConfigs[0].coreCount | tostring) + ")" else "N/A" end)\n" +
            "----------------------------------------------------------------------"
          '

name: List User Workbenches

on:
  workflow_dispatch: 

jobs:
  list-configurations:
    name: Get Workbench Configurations
    runs-on: ubuntu-latest
    
    permissions:
      id-token: write     
      contents: read
      
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4


      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider:  ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.SERVICE_ACCOUNT }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Fetch Workbench Configurations and Add to Summary
        run: |
          echo "### GCP Workbench Configurations for ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          
          # Capture output to a temporary file
          gcloud workbench instances list --location="-" --format="json" > workbench_data.json

          # Extract data with updated logic for Idle Shutdown and State
          jq -r --arg ACTOR "${{ github.actor }}" '
            .[] | 
            select(.labels.github_username == $ACTOR) | 
            "#### Instance: \(.name | split("/")[-1])",
            "| Property | Value |",
            "| --- | --- |",
            "| **Status** | \(.state) |",
            "| **Connection URL** | \(if .proxyUri then "[Open JupyterLab](\(.proxyUri))" else " Instance must be RUNNING" end) |",
            "| **Owner Email** | \(.creator // "N/A") |",
            "| **Machine Type** | \(.gceSetup.machineType | split("/")[-1]) |",
            "| **Storage (Boot/Data)** | \(.gceSetup.bootDisk.diskSizeGb)GB / \(.gceSetup.dataDisks[0].diskSizeGb)GB |",
            "| **Auto-Shutdown** | \(if .labels["idle-shutdown"] == "true" or .labels["idle_shutdown"] == "true" then " Enabled (120 min)" else " Enabled (\(.gceSetup.metadata["idle-timeout-minutes"] // .gceSetup.metadata["idle-timeout"] // "120")) minutes" end) |",
            "\n"
          ' workbench_data.json >> $GITHUB_STEP_SUMMARY

name: Teardown Vertex AI Workbench

on:
  workflow_dispatch:
    inputs:
      instance_name:
        description: 'Notebook Name to Destroy (e.g., alpha-notebook)'
        required: true
        type: string

jobs:
  destroy:
    name: Destroy Infrastructure
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider:  vars.WORKLOAD_IDENTITY_PROVIDER
          service_account: vars.SERVICE_ACCOUNT

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: "1.5.0"

      - name: Terraform Init (Dynamic User Folder)
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.GCP_STATE_BUCKET }}" \
            -backend-config="prefix=state/users/${{ github.actor }}"

      - name: Verify Ownership & Select Workspace
        run: |
          if terraform workspace select ${{ inputs.instance_name }}; then
            echo "Workspace located. Proceeding with destruction."
            echo "Workspace located. Proceeding with destruction."
          else
            echo "ERROR: You do not own a notebook named '${{ inputs.instance_name }}'."
            echo "ERROR: You do not own a notebook named '${{ inputs.instance_name }}'."
            echo "Access Denied or Instance Not Found."
            exit 1
          fi

      - name: Terraform Destroy
        run: |
          terraform destroy -auto-approve \
            -var="project_id=devops-sandbox-452616" \
            -var="region=asia-south1" \
            -var="vpc_network_id=projects/devops-sandbox-452616/global/networks/vasu-workbench-automation" \
            -var="subnet_id=projects/devops-sandbox-452616/regions/asia-south1/subnetworks/privatesubnet" \
            -var="project_id=devops-sandbox-452616" \
            -var="region=asia-south1" \
            -var="vpc_network_id=projects/devops-sandbox-452616/global/networks/vasu-workbench-automation" \
            -var="subnet_id=projects/devops-sandbox-452616/regions/asia-south1/subnetworks/privatesubnet" \
            -var="user_email=dummy@example.com" \
            -var="instance_name=${{ inputs.instance_name }}" \
            -var="machine_type=n1-standard-4" \
            -var="accelerator_type=NONE" \
            -var="accelerator_count=0" \
            -var="boot_disk_size=150" \
            -var="idle_timeout_seconds=7200" \
            -var="accelerator_type=NONE" \
            -var="accelerator_count=0" \
            -var="boot_disk_size=150" \
            -var="idle_timeout_seconds=7200" \
            -var="github_username=${{ github.actor }}" \
            -var="tf_runner_identity=serviceAccount:vasu-terraform-sa@devops-sandbox-452616.iam.gserviceaccount.com" \
            -var="admin_email=admin@example.com"
            -var="tf_runner_identity=serviceAccount:vasu-terraform-sa@devops-sandbox-452616.iam.gserviceaccount.com" \
            -var="admin_email=admin@example.com"

      - name: Cleanup Workspace
        run: |
          terraform workspace select default
          terraform workspace delete ${{ inputs.instance_name }}

      - name: Output Status
        run: |
          echo "Teardown Complete!"
          echo "Teardown Complete!"
          echo "Workbench '${{ inputs.instance_name }}' has been permanently deleted."

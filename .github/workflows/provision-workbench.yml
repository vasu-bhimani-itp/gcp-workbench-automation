name: Provision Vertex AI Workbench

on:
  workflow_dispatch:
    inputs:
      user_email:
        description: 'Developer Email'
        required: true
        type: string
      instance_name:
        description: 'Notebook Name (Must be unique per user)'
        required: true
        type: string
      region:
        description: 'GCP Region'
        required: true
        type: choice
        options:
          - asia-south1
          - us-central1
          - europe-west4
      machine_type:
        description: 'Compute Size'
        required: true
        type: choice
        options:
          - n1-standard-4
          - n1-standard-8
          - a2-highgpu-1g
      accelerator_type:
        description: 'GPU Type (Requires Approval if not NONE)'
        required: true
        type: choice
        options:
          - NONE
          - NVIDIA_TESLA_T4
          - NVIDIA_TESLA_A100
      accelerator_count:
        description: 'Number of GPUs'
        required: true
        default: "0"
        type: choice
        options:
          - "0"
          - "1"
          - "2"
      boot_disk_size:
        description: 'Boot Disk Size (GB)'
        required: true
        default: "150"
        type: string
      idle_timeout:
        description: 'Auto-Shutdown Inactivity Period'
        required: true
        type: choice
        options:
          - "7200"  # 2 Hours
          - "14400" # 4 Hours

jobs:
  provision:
    name: Provision Infrastructure
    runs-on: ubuntu-latest
    
    # DYNAMIC ENVIRONMENT ROUTING: GATES GPU REQUESTS
    environment: ${{ inputs.accelerator_type != 'NONE' && 'gpu-approval' || 'auto-approve' }}
    
    permissions:
      id-token: write 
      contents: read

    steps:
      - name: Check if Workspace Already Exists
        run: |
          STATE_PATH="gs://${{ vars.GCP_STATE_BUCKET }}/state/users/${{ github.actor }}/${{ inputs.instance_name }}.tfstate"

          echo "Checking if workspace already exists: $STATE_PATH"

          if gsutil ls "$STATE_PATH" > /dev/null 2>&1; then
            echo "❌ ERROR: Workspace '${{ inputs.instance_name }}' already exists."
            echo "Please choose a different instance_name."
            exit 1
          else
            echo "✅ Workspace name is unique. Proceeding..."
          fi

      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.SERVICE_ACCOUNT }}
          token_format: access_token

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Debug GCP Identity
        run: |
          gcloud auth list
          gcloud config list account

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: "1.5.0"

      - name: Terraform Init (Dynamic User Folder)
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.GCP_STATE_BUCKET }}" \
            -backend-config="prefix=state/users/${{ github.actor }}"

      - name: Terraform Workspace Management
        run: |
          terraform workspace select ${{ inputs.instance_name }} || terraform workspace new ${{ inputs.instance_name }}

      - name: Terraform Plan
        run: |
          terraform plan -out=tfplan \
            -var="project_id=${{ vars.GCP_PROJECT_ID }}" \
            -var="region=${{ inputs.region }}" \
            -var="vpc_network_id=${{ vars.GCP_VPC_NETWORK_ID }}" \
            -var="subnet_id=projects/devops-sandbox-452616/regions/${{ inputs.region }}/subnetworks/privatesubnet" \
            -var="user_email=${{ inputs.user_email }}" \
            -var="instance_name=${{ inputs.instance_name }}" \
            -var="machine_type=${{ inputs.machine_type }}" \
            -var="accelerator_type=${{ inputs.accelerator_type }}" \
            -var="accelerator_count=${{ inputs.accelerator_count }}" \
            -var="boot_disk_size=${{ inputs.boot_disk_size }}" \
            -var="idle_timeout_seconds=${{ inputs.idle_timeout }}" \
            -var="github_username=${{ github.actor }}" \
            -var="tf_runner_identity=${{ secrets.GCP_TERRAFORM_RUNNER_IDENTITY }}" \
            -var="admin_email=${{ secrets.ADMIN_EMAIL }}"

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan

      - name: Write Summary
        run: |
          PROXY_URL=$(terraform output -raw proxy_uri | tail -n 1)

          echo "## Provisioning Complete" >> $GITHUB_STEP_SUMMARY
          echo "- **User:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Workspace:** ${{ inputs.instance_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **JupyterLab:** https://$PROXY_URL" >> $GITHUB_STEP_SUMMARY
